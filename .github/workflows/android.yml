name: Android
# Runtime UI/native fixture targets Universal; the build job compiles both editions for regression.
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Resolve and verify dependencies without a previous runner's Gradle cache.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle/ci-user-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - run: python3 scripts/fetch-native.py
      - name: Verify dependencies, test, lint and build APKs
        run: chmod +x gradlew && ./gradlew --dependency-verification strict --no-daemon --stacktrace --max-workers=2 :core:test :app:testSignetDebugUnitTest :app:testExternalDebugUnitTest :app:lintSignetDebug :app:lintExternalDebug :app:assembleDebug :app:assembleRelease
      - name: Verify installable APK signatures, ABIs and 16 KB alignment
        run: python3 scripts/verify-apks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signet-build-reports
          path: |
            build/reports/dependency-verification/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            tests/evidence/*/apk-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: signet-apks
          path: |
            app/build/outputs/apk/**/debug/*.apk
            app/build/outputs/apk/**/release/*.apk
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle/runtime-user-home
      ANDROID_AVD_HOME: ${{ github.workspace }}/.gradle/avd
      ANDROID_USER_HOME: ${{ github.workspace }}/.gradle/android-user-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare authorized loopback transport fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/transport-lab.py --serve > /tmp/signet-lab.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q 'LOCAL LAB READY' /tmp/signet-lab.log; then break; fi
            sleep 1
          done
          grep -q 'LOCAL LAB READY' /tmp/signet-lab.log
          mkdir -p .gradle/transport-lab/android-assets
          cp .gradle/transport-lab/profiles.json .gradle/transport-lab/android-assets/local-profiles.json
      - name: Install emulator and enable runner KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-signet-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force --name signet-test --path "$ANDROID_AVD_HOME/signet-test.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          sed -i -e '/^hw.lcd.width=/d' -e '/^hw.lcd.height=/d' -e '/^hw.lcd.density=/d' -e '/^hw.cpu.ncore=/d' -e '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/signet-test.avd/config.ini"
          printf 'hw.lcd.width=720\nhw.lcd.height=1280\nhw.lcd.density=320\nhw.cpu.ncore=2\ndisk.dataPartition.size=2048M\n' >> "$ANDROID_AVD_HOME/signet-test.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/signet-test.avd\ntarget=android-36\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/signet-test.ini"
          "${ANDROID_HOME}/emulator/emulator" -list-avds | grep '^signet-test$'
      - name: Boot Android fixture before compiling
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          df -h . /tmp
          python3 -c "import shutil; assert shutil.disk_usage('.').free >= 4*1024**3, 'Insufficient runner disk for emulator'"
          "${ANDROID_HOME}/emulator/emulator" -avd signet-test -no-window -no-audio -no-boot-anim -no-snapshot -memory 4096 -gpu software -feature -Vulkan > /tmp/signet-emulator.log 2>&1 &
          signet_emulator_pid=$!
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          # Validate the fixture, then free its RAM/CPU while Kotlin and R8 compile.
          adb emu kill
          wait "$signet_emulator_pid"
      - run: python3 scripts/fetch-native.py
      - name: Compile instrumented APKs with strict verification
        run: chmod +x gradlew && ./gradlew --dependency-verification strict --no-daemon --stacktrace --max-workers=2 :app:assembleExternalDebug :app:assembleExternalRelease :app:assembleExternalDebugAndroidTest
      - name: Run Android UI and native TUN tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/evidence/runtime
          jps -lv | awk '/KotlinCompileDaemon/ {print $1}' | xargs -r kill
          python3 scripts/prune-runtime-build-cache.py
          ulimit -c 0
          df -h . /tmp
          python3 -c "import shutil; assert shutil.disk_usage('.').free >= 4*1024**3, 'Insufficient runner disk for emulator'"
          "${ANDROID_HOME}/emulator/emulator" -avd signet-test -no-window -no-audio -no-boot-anim -no-snapshot -memory 4096 -gpu software -feature -Vulkan > /tmp/signet-emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb get-state
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell cmd window dismiss-keyguard
          # Let post-boot System UI work finish before starting a GLES workload.
          adb shell am start -W -a android.settings.SETTINGS
          sleep 45
          python3 scripts/check-emulator-ui.py boot
          adb shell input keyevent HOME
          sleep 5
          adb logcat -d > tests/evidence/runtime/boot-logcat.txt
          adb install app/build/outputs/apk/external/debug/app-external-x86_64-debug.apk
          adb install app/build/outputs/apk/androidTest/external/debug/app-external-debug-androidTest.apk
          adb shell appops set com.signet.client.external ACTIVATE_VPN allow
          adb shell pm grant com.signet.client.external android.permission.POST_NOTIFICATIONS
          for port in 10888 10889 10890 10891 10894 18480 19095; do adb reverse tcp:$port tcp:$port; done
          adb shell am instrument -w -r -e localVpn true -e class com.signet.client.GlobeVisualTest,com.signet.client.QrImageTest,com.signet.client.UniversalUiSmokeTest com.signet.client.external.test/androidx.test.runner.AndroidJUnitRunner | tee tests/evidence/runtime/ui-instrumentation.txt
          grep -Eq '^OK \(4 tests\)' tests/evidence/runtime/ui-instrumentation.txt
          ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' tests/evidence/runtime/ui-instrumentation.txt
          adb pull /sdcard/Android/data/com.signet.client.external/files/country-frames tests/evidence/runtime/countries
          # Optional: UniversalUiSmokeTest currently has no UI screenshot fixture.
          if adb shell test -d /sdcard/Android/data/com.signet.client.external/files/ui-state; then
            adb pull /sdcard/Android/data/com.signet.client.external/files/ui-state tests/evidence/runtime/ui-state
          else
            echo 'No optional ui-state directory; continuing to native TUN tests'
          fi
          adb install -r app/build/outputs/apk/external/release/app-external-x86_64-release.apk
          SIGNET_TEST_PACKAGE=com.signet.client.external python3 scripts/capture-matrix.py
          adb shell dumpsys meminfo com.signet.client.external > tests/evidence/runtime/meminfo-release.txt
          adb install -r app/build/outputs/apk/external/debug/app-external-x86_64-debug.apk
          adb shell appops set com.signet.client.external ACTIVATE_VPN allow
          adb shell pm grant com.signet.client.external android.permission.POST_NOTIFICATIONS
          adb shell am instrument -w -r -e localVpn true -e class com.signet.client.ClientIntegrationTest,com.signet.client.TemplateTransportTest com.signet.client.external.test/androidx.test.runner.AndroidJUnitRunner | tee tests/evidence/runtime/native-instrumentation.txt
          cat tests/evidence/runtime/ui-instrumentation.txt tests/evidence/runtime/native-instrumentation.txt > tests/evidence/runtime/instrumentation.txt
          grep -Eq '^OK \(11 tests\)' tests/evidence/runtime/native-instrumentation.txt
          ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' tests/evidence/runtime/native-instrumentation.txt
          adb pull /sdcard/Android/data/com.signet.client.external/files/vpn-memory tests/evidence/runtime/vpn-memory
          python3 scripts/check-emulator-ui.py final
          adb shell dumpsys activity lastanr > tests/evidence/runtime/lastanr.txt
          ! grep -q 'ANR in ' tests/evidence/runtime/lastanr.txt
      - name: Collect emulator crash diagnostics
        if: failure()
        run: |
          mkdir -p tests/evidence/runtime
          cp /tmp/signet-emulator.log tests/evidence/runtime/emulator.txt || true
          timeout 15 adb logcat -d > tests/evidence/runtime/logcat.txt || true
          python3 scripts/check-emulator-ui.py failure || true
          timeout 15 adb logcat -d -b crash > tests/evidence/runtime/crash.txt || true
          timeout 15 adb shell dumpsys activity lastanr > tests/evidence/runtime/lastanr.txt || true
          timeout 15 adb pull /sdcard/Android/data/com.signet.client.external/files/ui-state tests/evidence/runtime/ui-state || true
          timeout 15 adb pull /sdcard/Android/data/com.signet.client.external/files/country-frames tests/evidence/runtime/countries || true
          timeout 15 adb pull /sdcard/Android/data/com.signet.client.external/files/vpn-memory tests/evidence/runtime/vpn-memory || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signet-runtime-evidence
          path: |
            tests/evidence/runtime/
            tests/evidence/screenshots/
            app/build/reports/androidTests/
            build/reports/dependency-verification/
