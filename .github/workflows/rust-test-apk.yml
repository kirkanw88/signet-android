name: Rust test APK
on:
  push:
    branches: [feature/rust-core-0.2.25]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle/rust-ci-user-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"'
      - name: Fetch pinned native engines
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch-native.py
          bash scripts/build-rust-candidate.sh
      - name: Build debug APKs with both engines
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          (cd "$RUNNER_TEMP/rust-sdk" && sha256sum -c SHA256SUMS)
          rust_sha=$(cut -d" " -f1 "$RUNNER_TEMP/rust-sdk/SHA256SUMS")
          ./gradlew --dependency-verification strict --no-daemon --stacktrace --max-workers=2 \
            -PsignetRustAar="${RUNNER_TEMP}/rust-sdk/xray-rust-mobile.aar" \
            -PsignetRustAarSha256="$rust_sha" -PsignetRustBurst=true \
            :app:testExternalDebugUnitTest :app:assembleExternalDebug
      - name: Verify packages and prepare test artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/rust-test
          for edition in external; do
            apk="app/build/outputs/apk/$edition/debug/app-$edition-arm64-v8a-debug.apk"
            test -s "$apk"
            "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$apk"
            python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              native = [n for n in names if n.startswith("lib/arm64-v8a/") and n.endswith(".so")]
              print(native)
              assert all("lib/arm64-v8a/" + n in native for n in ("libxray_ffi.so", "libxray_mobile_jni.so")), "Rust SDK native libraries missing"
          PY
            "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/signet-package.txt
            grep -F "package: name='com.signet.client.external'" /tmp/signet-package.txt | grep -F "versionName='0.2.25'"
            cp "$apk" "dist/rust-test/Signet-Universal-0.2.25-Rust-arm64-v8a.apk"
          done
          cp "$RUNNER_TEMP/rust-sdk/LICENSE" dist/rust-test/RUST-LICENSE.txt
          cp "$RUNNER_TEMP/rust-sdk/THIRD_PARTY_NOTICES.md" dist/rust-test/RUST-THIRD-PARTY-NOTICES.md
          cp "$RUNNER_TEMP/rust-sdk/core.env" dist/rust-test/RUST-SOURCE.txt
          cp "$RUNNER_TEMP/rust-sdk/SHA256SUMS" dist/rust-test/RUST-AAR-SHA256.txt
          echo "SDK source: 7885435a49f6d3728154dad99b6f5038182eb18d" >> dist/rust-test/RUST-SOURCE.txt
          (cd dist/rust-test && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: signet-universal-0.2.25-rust-test-arm64
          path: dist/rust-test/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-build-reports
          path: |
            build/reports/dependency-verification/
            app/build/reports/
